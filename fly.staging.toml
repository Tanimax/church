# fly.toml for the staging environment — deploy changes here and test them before
# promoting to production. Same shape as fly.toml, pointed at the staging app and its own
# database (a separate database on the same Postgres cluster as prod, not a separate server).
#
# Deploy with: flyctl deploy --config fly.staging.toml

app = 'church-attendance-app-staging'
primary_region = 'ewr'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # Fly waits for this check during deploys (a release that can't serve requests fails
  # instead of replacing the running one) and stops routing to a machine that fails it.
  # /health doesn't need the database; Fly doesn't follow redirects, hence the header.
  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/health'
    [http_service.checks.headers]
      X-Forwarded-Proto = 'https'

[mounts]
  source = 'data'
  destination = '/data'

[env]
  # DATABASE_URL is injected automatically by `flyctl postgres attach`.
  DataProtectionKeysPath = '/data/dataprotection-keys'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
