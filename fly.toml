# fly.toml app configuration file generated for church-attendance-app on 2026-07-25T18:55:35-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'church-attendance-app'
primary_region = 'ewr'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # Fly waits for this check during deploys (a release that can't serve requests fails
  # instead of replacing the running one) and stops routing to a machine that fails it.
  # /health doesn't need the database; Fly doesn't follow redirects, hence the header.
  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/health'
    [http_service.checks.headers]
      X-Forwarded-Proto = 'https'

[mounts]
  source = 'data'
  destination = '/data'

[env]
  # DATABASE_URL is injected automatically by `fly mpg attach`.
  DataProtectionKeysPath = '/data/dataprotection-keys'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
