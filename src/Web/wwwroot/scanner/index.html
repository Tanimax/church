<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner de présence</title>
    <link rel="manifest" href="/scanner/manifest.json">
    <link rel="apple-touch-icon" href="/card/icon-192.png">
    <meta name="theme-color" content="#111827">
    <link rel="stylesheet" href="/scanner/style.css">
</head>
<body>
    <div id="app">
        <div id="status-banner"></div>
        <form method="post" action="/admin/logout" id="logout-form">
            <button type="submit" id="logout-btn">Déconnexion</button>
        </form>
        <div id="mode-toggle">
            <button type="button" id="mode-culte" class="mode-btn active">Culte</button>
            <button type="button" id="mode-saintecene" class="mode-btn">Sainte Cène</button>
            <button type="button" id="mode-ecole" class="mode-btn">École Dominicale</button>
        </div>
        <header>
            <h1 id="scan-instructions">Présentez le QR code à la caméra</h1>
        </header>
        <div id="reader"></div>
        <div id="result-overlay">
            <div class="icon"></div>
            <div class="name"></div>
            <div class="message"></div>
        </div>
    </div>
    <script src="/scanner/lib/html5-qrcode.min.js"></script>
    <script src="/scanner/app.js"></script>
</body>
</html>
